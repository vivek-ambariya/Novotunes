version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    container_name: novatunes-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  backend:
    build: ./backend
    container_name: novatunes-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    env_file:
      - .env
  frontend:
    image: node:20-alpine
    container_name: novatunes-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  mongodata:
